[template]
cargo_generate_version = ">=0.23.0"
# files that belong to the template repository, not to generated projects
ignore = [".github", "TEMPLATE.md"]

# PostgreSQL connection settings. The password is never a placeholder:
# scripts/new-env asks for it and writes it to the ignored .env.
[placeholders.db_host]
type = "string"
prompt = "Database host"
default = "localhost"
regex = "^[A-Za-z0-9_.-]+$"

[placeholders.db_port]
type = "string"
prompt = "Database port"
default = "5432"
regex = "^[0-9]{1,5}$"

[placeholders.db_user]
type = "string"
prompt = "Database user"
default = "postgres"
regex = "^[A-Za-z0-9_.-]+$"

[placeholders.db_name]
type = "string"
prompt = "Database name (empty = project name)"
default = ""
regex = "^[A-Za-z0-9_]*$"
