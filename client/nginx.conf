# sign-in attempts per client address; the API sits behind this proxy and would
# otherwise see a single address for everyone
limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 2m;

    root /usr/share/nginx/html;

    # resolve the API at request time, so a restarted container is found again
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3000;

    location ~ ^/api/(auth/(login|register))$ {
        limit_req zone=signin burst=5 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
